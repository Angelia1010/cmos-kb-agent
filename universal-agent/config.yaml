## KB 知识库智能体 — 配置模板(基于裁剪版 uniagent)
## 复制为 config.yaml 使用。生产时把 models[0].use 换成内部网关/ChatOpenAI。

log_level: info

models:
  - name: default
    use: "kbagent.lingxi_provider:LingxiSSLChatOpenAI"   # 灵犀 SSL 策略类(已 vendor)
    model: "Qwen3.5-397B-A17B-FP8"
    temperature: 0.44
    kwargs:
      api_key: "${QWEN_API_KEY}"          # 环境变量注入,注意是 ${VAR} 语法
      base_url: "https://10.254.123.75:30006/v1"
      max_tokens: 8000
      timeout: 600.0
      max_retries: 2
      streaming: true
      cs_verify_ssl: false                # 内网自签证书:跳过证书校验(仅批准端点可用)
      cs_allow_legacy_dh: true            # 兼容旧版 DH 密码套件(OpenSSL SECLEVEL=1)
      extra_body:                         # vLLM 透传:关闭 Qwen3 思考模式
        chat_template_kwargs:
          enable_thinking: false

tools: []          # KB 工具由 kbagent.pipeline 以代码方式绑定(RETRIEVAL_TOOLS / PROCESSING_TOOLS)

loop:
  # 注意:本段对 kbagent 服务链路不生效。真实预算在
  # src/kbagent/config.py 的 budget(检索)与 kbagent_service/app.py 的
  # DEFAULT_TIMEOUT_S(端到端),调超时请改那两处。
  max_iterations: 2
  max_tokens: 0
  max_time_seconds: 2
  verify_every: 1          # 每轮强制充分性验证
  checkpoint_every: 1

state:
  backend: local
  state_dir: ".uniagent/state"

verification:
  strategy: none           # SufficiencyVerifier 由 kbagent 代码传入
  confidence_threshold: 0.7
  evaluator_model: ""

skills:
  enabled: true
  directories:
    - skills               # 业务技能包: taocan/kuandai/zhangdan/tousu
  max_active: 1            # 单查询命中一个业务类目即可
  auto_match: true

extra_middleware: []
