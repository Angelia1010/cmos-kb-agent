[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-agent"
version = "2.0.2"
description = "10086 坐席知识库智能体 — 编排好的主智能体 + 三个自主规划的子智能体(裁剪版 uniagent)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/uniagent", "src/kbagent"]
